<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're on the list — Audra</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-asset">
          <img src="/assets/logo.png" alt="Audra Technology" />
        </div>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="hero-section">
      <div class="hero-content">
        <div class="hero-badge">Request Received</div>
        <h1 class="hero-title">You're on <span class="gradient-text">the list</span>.</h1>
        <p class="hero-subtitle">Thanks for your interest in Audra. We're onboarding beta testers in small waves — you'll get an email when your access is ready.</p>
        <div class="hero-actions">
          <a href="/" class="hero-btn secondary">Back to Home</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <span class="footer-brand">Audra Technology</span>
      <span class="footer-copy">© 2026 Spec Craft Media Ltd. All rights reserved.</span>
    </div>
  </footer>
</body>
</html>
